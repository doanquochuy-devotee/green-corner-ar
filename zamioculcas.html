<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Model - Cây Kim Phát Tài Góc Lớp</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    .plant-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 280px;
      pointer-events: none;
    }
    .plant-badge h3 { font-size: 15px; color: #1e293b; margin-bottom: 4px; }
    .plant-badge p { font-size: 12px; color: #64748b; line-height: 1.4; }
    .ar-button {
      background-color: #2D5A3E;
      color: white;
      border-radius: 30px;
      border: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(45, 90, 62, 0.35);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="plant-badge">
    <h3>Kim Phát Tài (Zamioculcas)</h3>
    <p>• <strong>Vị trí:</strong> Góc bục giảng / Cuối lớp<br>
       • <strong>Kích thước:</strong> Cao ~78cm | Chậu composite<br>
       • <strong>Đặc tính:</strong> Lọc Xylene, Toluene; thân củ tích nước chịu hạn cực tốt</p>
  </div>

  <model-viewer 
    src="zamioculcas.glb" 
    alt="3D Zamioculcas Plant"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="auto"
    camera-controls 
    auto-rotate 
    rotation-per-second="30deg"
    shadow-intensity="1" 
    shadow-softness="0.8" 
    environment-image="neutral" 
    exposure="1.0">
    <button slot="ar-button" class="ar-button">
      Xem AR trong lớp học
    </button>
  </model-viewer>

</body>
</html>
