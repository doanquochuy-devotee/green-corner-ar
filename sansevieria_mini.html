<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Model - Cây Lưỡi Hổ Búp Sen (Bậu Cửa Sổ)</title>
  
  <!-- Thư viện Google model-viewer chính thức -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Bảng thông số kỹ thuật và sinh học */
    .plant-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 300px;
      pointer-events: none;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .plant-badge h3 { 
      font-size: 15px; 
      color: #1e293b; 
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .plant-badge p { 
      font-size: 12px; 
      color: #475569; 
      line-height: 1.5; 
    }

    /* Nút kích hoạt AR */
    .ar-button {
      background-color: #2D5A3E;
      color: white;
      border-radius: 30px;
      border: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(45, 90, 62, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ar-button:active {
      transform: translateX(-50%) scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Khối thông tin quy chuẩn theo concept Biophilic Minimalism -->
  <div class="plant-badge">
    <h3>🌿 Lưỡi Hổ Búp Sen (Sansevieria Hahnii)</h3>
    <p>
      • <strong>Vị trí:</strong> Dải bậu cửa sổ (giải phóng 100% sàn)<br>
      • <strong>Kích thước:</strong> Cao 15 - 20cm | ĐK chậu 10 - 12cm<br>
      • <strong>Cửa sổ:</strong> Nằm dưới mép kính, không cản trở rèm kéo<br>
      • <strong>Đặc tính:</strong> Nhả O₂ ban đêm (CAM), lọc Formaldehyde
    </p>
  </div>

  <!-- Trình xem 3D & AR Google -->
  <model-viewer 
    src="sansevieria_mini.glb" 
    alt="3D Sansevieria Mini Plant"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="auto"
    camera-controls 
    touch-action="pan-y"
    auto-rotate 
    rotation-per-second="30deg"
    shadow-intensity="1" 
    shadow-softness="0.8" 
    environment-image="neutral" 
    exposure="1.0">

    <button slot="ar-button" class="ar-button">
      Xem AR trong lớp học
    </button>
  </model-viewer>

</body>
</html>
